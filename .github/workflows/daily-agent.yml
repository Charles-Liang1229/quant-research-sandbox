name: Daily Trading Agent

on:
  schedule:
    # UTC 06:00 = 悉尼 16:00 (AEST冬令时)，只在周一到周五跑
    # 注：GitHub的定时不保证准点，可能延迟几分钟到半小时——对本agent无影响
    - cron: "0 6 * * 1-5"
  workflow_dispatch: {}   # 允许在网页上手动点按钮触发（测试用）

permissions:
  contents: write   # 允许把决策日志提交回仓库

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # checkout 只带来被 git 跟踪的文件；decisions_log.csv 在 .gitignore 里，
      # 所以云端容器每次都是空日志 → 追加当天几行后覆盖掉仓库里的历史。
      # 显式把仓库版本取出来做基底，业绩档案才能连续累积。
      - name: 恢复历史决策日志
        run: |
          git show origin/main:decisions_log.csv > decisions_log.csv 2>/dev/null \
            && echo "已恢复 $(wc -l < decisions_log.csv) 行历史" \
            || echo "仓库中暂无历史日志，从空白开始"

      # AI 主题股池由私有仓库 autotrader 每周日生成，这里拉最新版覆盖快照。
      # 令牌缺失或拉取失败时沿用旧快照（超过 21 天自动降级到成交额筛选），不阻断交易。
      - name: 拉取 autotrader 最新 AI 股池
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Charles-Liang1229/autotrader
          token: ${{ secrets.AUTOTRADER_READ_TOKEN }}
          path: _autotrader
          sparse-checkout: research/universe.json
          sparse-checkout-cone-mode: false

      - name: 更新股池快照
        run: |
          if [ -f _autotrader/research/universe.json ]; then
            cp _autotrader/research/universe.json universe_ai.json
            echo "已同步 AI 股池（生成于 $(python -c 'import json;print(json.load(open("universe_ai.json"))["generated_at"])')）"
          else
            echo "::warning::未能拉取 autotrader 股池，沿用仓库内旧快照"
          fi

      # 数据层的静默污染（如盘前 NaN 尾行把多头信号翻成空头）不会报错，
      # 只会让打分悄悄跑偏。放在下单之前跑，坏数据宁可不交易。
      - name: 单元测试（数据清洗与信号）
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: 运行Agent决策循环
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python trading_agent.py

      - name: 显示当前持仓
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python trading_agent.py status

      - name: 把决策日志提交回仓库（形成公开的业绩档案）
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f decisions_log.csv universe_ai.json
          git diff --cached --quiet && echo "无新决策，跳过提交" && exit 0
          git commit -m "log: agent decisions $(date -u +%Y-%m-%d)"
          # 别的运行可能刚推过；rebase 后重试，避免非快进被拒后静默丢日志
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "推送第 $i 次失败，重试…"; sleep 5
          done
          echo "::error::决策日志推送失败——业绩档案已断档"; exit 1
